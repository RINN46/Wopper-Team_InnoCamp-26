<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src = "../static/script_tasks.js"></script>
    <title>WorkFlow - Задачи</title>
    <link rel="stylesheet" href="../static/style.css">


</head>
<body>
    <header>
        <div class="logo">WorkFlow.</div>
        <div class="header-actions">
            <a href="../chat_page" class="header-link">ЛС</a>
            <a href="#" class="header-link">Профиль</a>
        </div>
    </header>

    <div class="container">
        <aside>
            <nav class="nav-menu">

                <a href="./main_page" class="nav-item active">расписание</a>
                <a href="./staff" class="nav-item">Сотрудники</a>
                <a href="./tasks" class="nav-item">задачи</a>
                <a href="./menagment" class="nav-item">менеджмент</a>

            </nav>
        </aside>

        <main>
            <div class="main-content">
                <h1>Задачи</h1>

                <div class="tasks-wrapper">
                    <div class="tasks-list-section">
                        <ul class="tasks-list" id="tasksList">


                        </ul>
                    </div>

                    <div class="task-form-section">
                        <h2>+ Добавить новую задачу</h2>

                        <form id="taskForm" class="task-form">
                            <div class="form-group">
                                <label for="taskTitle">Название задачи</label>
                                <input type="text" id="title" placeholder="Введите название" required>
                            </div>

                            <div class="form-group">
                                <label for="taskAssignee">Назначить на</label>
                                <input type="text" id="login" placeholder="Татьяна Пупкина">
                            </div>

                            <div class="form-group">
                                <label for="taskDeadline" >Дедлайн</label>
                                <input type="text" id="deadline" required placeholder="15 января">
                            </div>

                            <button class="send_butt" onclick="create_task()">Добавить</button>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

</body>
</html>
