<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkFlow - Расписание</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">WorkFlow.</div>
        <div class="header-actions">
            <a href="#" class="header-link">ЛС</a>
            <a href="#" class="header-link">Профиль</a>
        </div>
    </header>

    <div class="container">
        <aside>
            <nav class="nav-menu">
                <a href="index.html" class="nav-item active">расписание</a>
                <a href="employees.html" class="nav-item">Сотрудники</a>
                <a href="tasks.html" class="nav-item">задачи</a>
                <a href="management.html" class="nav-item">менеджмент</a>
            </nav>
        </aside>

        <main>
            <h1>Расписание</h1>

            <div class="schedule-days">
                <button class="day-btn">ПН</button>
                <button class="day-btn">ВТ</button>
                <button class="day-btn">СР</button>
                <button class="day-btn">ЧТ</button>
                <button class="day-btn">ПТ</button>
                <button class="day-btn">СБ</button>
                <button class="day-btn">ВС</button>
            </div>

            <div class="schedule-grid">
                <div class="schedule-card">
                    <h3>Планёрка</h3>
                    <p>10:00 - 11:00</p>
                    <span class="event-type">Встреча</span>
                </div>
                <div class="schedule-card">
                    <h3>Встреча с клиентом</h3>
                    <p>14:00 - 15:30</p>
                    <span class="event-type">Онлайн</span>
                </div>
                <div class="schedule-card">
                    <h3>Презентация проекта</h3>
                    <p>15:00 - 16:00</p>
                    <span class="event-type">Презентация</span>
                </div>
                <div class="schedule-card">
                    <h3>Обеденный перерыв</h3>
                    <p>12:00 - 13:00</p>
                    <span class="event-type">Перерыв</span>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
